name: uSync Build

# Build + pack validation for the uSync packages on push/PR.
# Releases are handled by release.yml (Actions -> Release -> Run workflow).

on:
  push:
    branches:
      - main
    paths:
      - 'src/uSync/**'
      # uSync builds against the main package via project references, so a
      # breaking change there breaks this build too.
      - 'src/Umbraco.Community.CSPManager/**'
      - 'src/Directory.Build.props'
      - 'src/Directory.Packages.props'
      - 'global.json'
      - '.github/actions/**'
      - '.github/workflows/usync.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/uSync/**'
      # uSync builds against the main package via project references, so a
      # breaking change there breaks this build too.
      - 'src/Umbraco.Community.CSPManager/**'
      - 'src/Directory.Build.props'
      - 'src/Directory.Packages.props'
      - 'global.json'
      - '.github/actions/**'
      - '.github/workflows/usync.yml'

env:
  USYNC_PROJECT: "./src/uSync/Umbraco.Community.CSPManager.uSync/Umbraco.Community.CSPManager.uSync.csproj"
  COMPLETE_PROJECT: "./src/uSync/Umbraco.Community.CSPManager.uSync.Complete/Umbraco.Community.CSPManager.uSync.Complete.csproj"
  OUT_FOLDER: ./build-out/
  BUILD_VERSION: "0.0.0-ci.${{ github.run_number }}"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: './src/uSync/Umbraco.Community.CSPManager.uSync.Complete/Client/package.json'
          cache: 'npm'
          cache-dependency-path: './src/uSync/Umbraco.Community.CSPManager.uSync.Complete/Client/package-lock.json'

      # No separate npm steps: the csproj builds the client, and packing from a clean
      # checkout here is what catches a package shipped without it (as release.yml does).
      - name: Build & Pack uSync
        run: dotnet pack "$USYNC_PROJECT" -c Release -p:Version="$BUILD_VERSION" --output "$OUT_FOLDER"

      - name: Build & Pack uSync Complete
        run: dotnet pack "$COMPLETE_PROJECT" -c Release -p:Version="$BUILD_VERSION" --output "$OUT_FOLDER"

      - name: Verify uSync Complete package contains the backoffice client
        run: >-
          unzip -l "${OUT_FOLDER}Umbraco.Community.CSPManager.uSync.Complete.$BUILD_VERSION.nupkg"
          | grep -q 'staticwebassets/App_Plugins/uSyncCspComplete/umbraco-package.json'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: uSync Build Output
          path: ${{ env.OUT_FOLDER }}
