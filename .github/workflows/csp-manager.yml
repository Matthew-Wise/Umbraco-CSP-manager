name: CSP Manager Build

# Build + test validation for the main package on push/PR.
# Releases are handled by release.yml (Actions -> Release -> Run workflow).

on:
  push:
    branches:
      - main
    paths:
      - 'src/Umbraco.Community.CSPManager/**'
      - 'src/Umbraco.Community.CSPManager.Tests/**'
      - 'src/Umbraco.Community.CSPManager.Benchmarks/**'
      - 'src/Directory.Build.props'
      - 'src/Directory.Packages.props'
      - 'global.json'
      - '.github/actions/**'
      - '.github/workflows/csp-manager.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/Umbraco.Community.CSPManager/**'
      - 'src/Umbraco.Community.CSPManager.Tests/**'
      - 'src/Umbraco.Community.CSPManager.Benchmarks/**'
      - 'src/Directory.Build.props'
      - 'src/Directory.Packages.props'
      - 'global.json'
      - '.github/actions/**'
      - '.github/workflows/csp-manager.yml'
      - '.github/workflows/release.yml'

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write

    env:
      LogFileName: "test-results.trx"
      PROJECT: "./src/Umbraco.Community.CSPManager/Umbraco.Community.CSPManager.csproj"
      TESTPROJECT: "./src/Umbraco.Community.CSPManager.Tests/Umbraco.Community.CSPManager.Tests.csproj"
      TESTLOGPATH: "./src/Umbraco.Community.CSPManager.Tests/TestResults/"
      BUILD_VERSION: "0.0.0-ci.${{ github.run_number }}"
      OUT_FOLDER: ./build-out/

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: './src/Umbraco.Community.CSPManager/Client/package.json'
          cache: 'npm'
          cache-dependency-path: './src/Umbraco.Community.CSPManager/Client/package-lock.json'

      - name: Install client dependencies
        run: npm ci
        working-directory: ./src/Umbraco.Community.CSPManager/Client

      - name: Build client
        run: npm run build
        working-directory: ./src/Umbraco.Community.CSPManager/Client

      - name: Build & Pack
        run: dotnet pack $PROJECT -c Release -p:Version=$BUILD_VERSION --output ${{env.OUT_FOLDER}}

      - name: Run tests
        run: dotnet test ${{env.TESTPROJECT}} -c Release --verbosity normal --filter "Category!=LongRunning" --logger "trx;LogFileName=$LogFileName" --collect:"XPlat Code Coverage"

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results
          path: "${{env.TESTLOGPATH}}${{env.LogFileName}}"

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: coverage-results
          path: "${{env.TESTLOGPATH}}**/coverage.cobertura.xml"

      - name: Upload nuget packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{env.OUT_FOLDER}}
